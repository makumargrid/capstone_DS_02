<!doctype html><html><head><meta charset=utf-8><title>Geometry Agent Harness</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<link rel=stylesheet href="/ui/static/style.css"></head><body>
<header><h1>◇ Geometry Agent Harness</h1><span class=sub>prompt → verified CAD → editable handoff</span></header>
<main>
 <section class=card>
  <h2>New design</h2>
  <textarea id=prompt rows=4 placeholder="e.g. A centrifugal impeller: cone hub base dia 100mm, top 30mm, height 60mm, 15mm bore, 7 swept blades 2mm thick."></textarea>
  <button id=go>Generate</button>
  <div id=msg class=msg></div>
 </section>
 <section class=card>
  <h2>Runs</h2>
  <table id=runs><thead><tr><th>run</th><th>state</th><th>prompt</th><th></th></tr></thead><tbody></tbody></table>
 </section>
</main>
<script src="/ui/static/app.js"></script></body></html>
